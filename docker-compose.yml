services:
  app:
    image: ghcr.io/jklancic/personal-branding:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

# medium-rss-wrapper runs from its own repository's compose file.
# No Watchtower here: the shared stack in /opt/stacks/watchtower on the VPS
# updates every labeled container on the host.
