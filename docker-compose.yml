services:
  app:
    image: ghcr.io/jklancic/personal-branding:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    environment:
      # containrrr/watchtower is unmaintained and its bundled Docker client
      # defaults to an ancient API version that newer Engine releases reject.
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup --label-enable
